<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bylance</title>
    <meta name="description" content="Каталог оригинальной техники Apple, Dyson и фототехники в Алматы. Рассрочка Kaspi и Halyk, выгодные цены за наличные, доставка и заказ в WhatsApp." />
    <meta property="og:title" content="Bylance" />
    <meta property="og:description" content="Оригинальная техника Apple, Dyson и фототехника. Рассрочка Kaspi и Halyk, спеццены и быстрый заказ в WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var manual = localStorage.getItem('bylance_manual_theme');
          if (prefersDark || manual === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#0d0f12] text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
